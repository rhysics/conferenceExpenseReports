[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conference-expense-reports"
version = "0.1.0"
description = "Generate LaTeX-based conference expense reports for university reimbursement from a YAML file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rhysics" }]
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "requests>=2.31",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
expense-report = "expense_report.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_report"]
